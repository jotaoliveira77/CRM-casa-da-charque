# CRM Casa da Charque: banco PostgreSQL + API (Fastify/Prisma) + front (Next.js)
#   docker compose up -d --build
# Depois acesse http://localhost:3000
# Para mudar senhas e segredos, copie .env.example para .env e edite.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      TZ: America/Recife
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    ports:
      # Só na máquina local, para ferramentas como DBeaver ou pgAdmin
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:-crm}@db:5432/crm?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-gerencia@casadacharque.local}
      SEED_SENHA: ${SEED_SENHA:-charque123}
      SEED_EXEMPLO: ${SEED_EXEMPLO:-true}
      TZ: America/Recife
    ports:
      - "3333:3333"

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:3333
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: America/Recife
    ports:
      - "3000:3000"

volumes:
  dados-postgres:
